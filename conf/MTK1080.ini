[meta]
name = "天玑 1080"
author = 小疣然
configVersion = 17
loglevel = "INFO"

[function]
DisableQcomGpu = false
AffintySetter = false
CpuIdleScaling_Governor = false
EasScheduler = true
cpuset = true
LoadBalancing = true
AdjIOScheduler = true
LaunchBoost = false

[LaunchBoost]
