[meta]
name = "天玑8400Ultra"
author = 小疣然
configVersion = 17
loglevel = "INFO"

[function]
DisableQcomGpu = false
AffintySetter = false
CpuIdleScaling_Governor = false
EasScheduler = true
cpuset = true
LoadBalancing = true
AdjIOScheduler = true
LaunchBoost = false

[LaunchBoost]
BoostRateMs = 1500
FreqMulti = 1.25
UclampTopAppBoostMin = 20

[CoreAllocation]
sparePlan = false
cpusetCore = "4-7"
cpuctlUclampBoostMin = "0"
cpuctlUclampBoostMax = "80"

[CoreFramework]
SmallCorePath = 0
MediumCorePath = 4
BigCorePath = 7

[IO_Settings]
Scheduler = "mq-deadline"
IO_optimization = true

[Other]
AdjQcomBus_dcvs = false

[EasSchedulerValue]
sched_min_granularity_ns = "2000000" 
sched_nr_migrate = "30"
sched_wakeup_granularity_ns = "3200000"
sched_schedstats = "0"

[ParamSchedPath] 
ParamSchedPath1 = "down_rate_limit_us"
ParamSchedPath2 = "up_rate_limit_us"
ParamSchedPath3 = ""
ParamSchedPath4 = ""
ParamSchedPath5 = ""
ParamSchedPath6 = ""
ParamSchedPath7 = ""
ParamSchedPath8 = ""
ParamSchedPath9 = ""
ParamSchedPath10 = ""
ParamSchedPath11 = ""
ParamSchedPath12 = ""

[CpuIdle]
