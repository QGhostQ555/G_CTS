[meta]
name = "骁龙8Elite"
author = 小疣然
configVersion = 17
loglevel = "INFO"

[function]
DisableQcomGpu = false
AffintySetter = false
CpuIdleScaling_Governor = false
EasScheduler = true
cpuset = true
LoadBalancing = true
AdjIOScheduler = true
LaunchBoost = false

[LaunchBoost]
BoostRateMs = 1200
FreqMulti = 1.25
UclampTopAppBoostMin = 20

[CoreAllocation]
sparePlan = false
cpusetCore = "4-7"
cpuctlUclampBoostMin = "0"
cpuctlUclampBoostMax = "80"

[CoreFramework]
#这里并不是中核0 超大核6 是为了规避小核中核一致为0导致的异常日志
MediumCorePath = 0
BigCorePath = 6

[IO_Settings]
Scheduler = "mq-deadline"
IO_optimization = true

[Bus_dcvs] 
CPUllccmin = "/sys/class/devfreq/kgsl-busmon/min_freq"
CPUllccmax = "/sys/class/devfreq/kgsl-busmon/max_freq"
CPUddrmin = "/sys/class/devfreq/3d00000.qcom,kgsl-3d0/min_freq"
CPUddrmax = "/sys/class/devfreq/3d00000.qcom,kgsl-3d0/max_freq"

[Other]
AdjQcomBus_dcvs= false

[EasSchedulerValue]
sched_min_granularity_ns = "2000000" 
sched_nr_migrate = "30"
sched_wakeup_granularity_ns = "3200000"
sched_schedstats = "0"

[ParamSchedPath] 
ParamSchedPath1 = "up_rate_limit_us"
ParamSchedPath2 = "down_rate_limit_us"
ParamSchedPath3 = ""
ParamSchedPath4 = ""
ParamSchedPath5 = ""
ParamSchedPath6 = ""
ParamSchedPath7 = ""
ParamSchedPath8 = ""
ParamSchedPath9 = ""
ParamSchedPath10 = ""
ParamSchedPath11 = ""
ParamSchedPath12 = ""

[CpuIdle]
current_governor = "qcom-cpu-lpm"

[Cpuset]
top_app = "0-7"
foreground = "0-5"
restricted = "0-4"
system_background = "1-2"
background = "0-2"

[powersave]
scaling_governor = "walt"
UclampTopAppMin = "0"
UclampTopAppMax = "100"
UclampTopApplatency_sensitive = "0"
UclampForeGroundMin = "0"
